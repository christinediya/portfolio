<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera case study</title>
<meta name="description" content="Vera: an AI detection tool with a personality. A UX/UI case study by Christine Gomes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#151522}
h1,h2,h3{font-family:'Space Grotesk','Instrument Sans',sans-serif;letter-spacing:-0.025em}
@keyframes vr-ping{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
a{color:#ADFF71}a:hover{color:#D6FFB5}
@keyframes vr-float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
@keyframes vr-glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<template id="dc-template">
<main style="font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; color: #ECEAF8; background: linear-gradient(180deg, #151522 0%, #2A2846 30%, #3B3866 60%, #232238 100%); font-size: 18px; line-height: 1.6; overflow-x: hidden">

<!-- HERO -->
<section style="position: relative; padding: 72px 24px 56px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: -120px; top: -80px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(178,58,160,0.55) 0%, rgba(178,58,160,0) 70%); animation: vr-glow 6s ease-in-out infinite"></div>
<div aria-hidden="true" style="position: absolute; right: -100px; bottom: -160px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(173,255,113,0.28) 0%, rgba(173,255,113,0) 70%); animation: vr-glow 7s ease-in-out infinite 1s"></div>
<div style="position: relative; max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 460px; min-width: 0">
<div style="display: flex; align-items: center; gap: 16px; margin-bottom: 28px">
<img src="assets/6d7281a2e9682cf8f16a34c90b9ba7cc.png" alt="Vera logo inside a glowing orb" style="width: 76px; height: 76px; border-radius: 50%">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #C9C4F0">Case study · UX/UI · March 2025</span>
</div>
<h1 style="margin: 0 0 10px; font-weight: 700; font-size: 88px; line-height: 0.95; letter-spacing: -0.03em; color: #FFFFFF">Vera</h1>
<p style="margin: 0 0 22px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; color: #ADFF71">Vera-fy it.</p>
<p style="margin: 0 0 32px; font-size: 21px; line-height: 1.5; max-width: 36ch; color: #E2DFF5">An AI detection tool with a personality. It checks videos, images, audio, documents, links and text, then explains why something looks AI-made, wherever that content shows up.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 540px">
<div style="background: #F3B440; color: #1B1A2E; border-radius: 18px; padding: 14px 16px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">My role</p><p style="margin: 2px 0 0; font-size: 15px; line-height: 1.4">Product designer · mobile app, iOS integrations, web homepage</p></div>
<div style="background: #33AE9C; color: #0F1F1C; border-radius: 18px; padding: 14px 16px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Team</p><p style="margin: 2px 0 0; font-size: 15px; line-height: 1.4">3 designers</p></div>
<div style="background: #E08AD1; color: #2A1027; border-radius: 18px; padding: 14px 16px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Timeline</p><p style="margin: 2px 0 0; font-size: 15px; line-height: 1.4">One week · March 1–8, 2025</p></div>
<div style="background: #9E8FE2; color: #17122E; border-radius: 18px; padding: 14px 16px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Context</p><p style="margin: 2px 0 0; font-size: 15px; line-height: 1.4">UMD Info Challenge · Mindpetal prompt</p></div>
</div>
</div>
<div style="flex: 1 1 400px; min-width: 0; position: relative; display: flex; justify-content: center; padding: 20px 0">
<div style="width: 280px; max-width: 80%; border-radius: 40px; border: 8px solid #0C0C16; overflow: hidden; box-shadow: 0 30px 80px rgba(120,40,140,0.45), 0 0 0 1px rgba(255,255,255,0.08); transform: rotate(-4deg)">
<img src="assets/4daad3a6775113fed909a0bf5aa250e5.jpg" alt="Vera mobile home screen: What can I Vera-fy today?" style="display: block; width: 600%; max-width: none; height: auto; transform: translateX(-16.6667%)">
</div>
<span style="position: absolute; left: 4%; top: 12%; background: #F3B440; color: #1B1A2E; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 8px 16px; --r: -8deg; animation: vr-float 3.4s ease-in-out infinite">Video</span>
<span style="position: absolute; right: 2%; top: 26%; background: #33AE9C; color: #0F1F1C; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 8px 16px; --r: 7deg; animation: vr-float 3s ease-in-out infinite .5s">Image</span>
<span style="position: absolute; left: 0; bottom: 22%; background: #E08AD1; color: #2A1027; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 8px 16px; --r: 6deg; animation: vr-float 3.8s ease-in-out infinite 1s">Audio</span>
<span style="position: absolute; right: 6%; bottom: 10%; background: #ADFF71; color: #18260C; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 8px 16px; --r: -5deg; animation: vr-float 3.2s ease-in-out infinite 1.4s">Text</span>
</div>
</div>
</section>

<!-- BRIEF -->
<section style="padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 340px; min-width: 0">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">The big question</p>
<h2 style="margin: 0; font-weight: 600; font-size: 36px; line-height: 1.2; color: #FFFFFF">How might we increase AI literacy for the general public so that it is easily accessible for all?</h2>
</div>
<div style="flex: 1.3 1 420px; min-width: 0">
<p style="margin: 0 0 18px"><strong style="color: #FFFFFF">The problem.</strong> AI-generated text, images, voices and video are getting harder to tell apart from human work, and misinformation spreads fastest in exactly the places people trust most: their feeds, their messages, their phone calls.</p>
<p style="margin: 0 0 18px"><strong style="color: #FFFFFF">The brief.</strong> Mindpetal challenged us at UMD's Info Challenge to make AI recognition fun, creative and accessible, whatever someone's tech literacy. We had one week.</p>
<div style="background: rgba(173,255,113,0.12); border: 1px solid rgba(173,255,113,0.45); border-radius: 20px; padding: 20px 24px">
<p style="margin: 0"><strong style="color: #ADFF71">My part.</strong> I designed Vera's mobile app and its iOS integrations, an iMessage app for checking suspicious texts and a voicemail check from Control Center, and helped design the web homepage.</p>
</div>
</div>
</div>
</section>

<!-- RESEARCH -->
<section style="padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">Research</p>
<h2 style="margin: 0 0 14px; font-weight: 600; font-size: 42px; line-height: 1.15; color: #FFFFFF">Two people, very different reasons to doubt</h2>
<p style="margin: 0 0 36px; max-width: 66ch; color: #D9D5F0">We looked at how everyday people run into AI content and deliberately drew from opposite ends: an older user and a young creative. Both became personas that guided every screen.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-bottom: 48px">
<div style="background: #F7F5FF; color: #1B1A2E; border-radius: 28px; padding: 28px">
<div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px">
<div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #F3B440; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px">KJ</div>
<div><p style="margin: 0; font-weight: 700; font-size: 22px; line-height: 1.2">Karen Johnson</p><p style="margin: 0; font-size: 15px; color: #4A4766">60 · retired school teacher · suburban Ohio</p></div>
</div>
<p style="margin: 0 0 12px; font-size: 16px">Keeps up with family and news on Facebook and YouTube, but struggles to tell fake news, clickbait and manipulated images from the real thing.</p>
<p style="margin: 0; font-size: 16px"><strong>Needs:</strong> a simple, reliable way to check what friends forward her, with clear explanations instead of jargon.</p>
</div>
<div style="background: #F7F5FF; color: #1B1A2E; border-radius: 28px; padding: 28px">
<div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px">
<div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #E08AD1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px">AR</div>
<div><p style="margin: 0; font-weight: 700; font-size: 22px; line-height: 1.2">Alex Rivera</p><p style="margin: 0; font-size: 15px; color: #4A4766">21 · art student · Brooklyn, NY</p></div>
</div>
<p style="margin: 0 0 12px; font-size: 16px">Comfortable in Procreate and Adobe, active in online art communities, and uneasy about AI art that mimics real artists' styles.</p>
<p style="margin: 0; font-size: 16px"><strong>Needs:</strong> a trustworthy check on whether a piece is human-made, and a way to learn about AI without feeling overwhelmed.</p>
</div>
</div>
<h3 style="margin: 0 0 18px; font-weight: 600; font-size: 26px; color: #FFFFFF">What existing tools were missing</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px">
<div style="border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 20px; background: rgba(255,255,255,0.05)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 18px; color: #FFFFFF">ZeroGPT</p><p style="margin: 0; font-size: 15px; color: #D9D5F0">Simple, accurate and handles multiple files, but explains little and is mostly text-only.</p></div>
<div style="border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 20px; background: rgba(255,255,255,0.05)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 18px; color: #FFFFFF">Undetectable AI</p><p style="margin: 0; font-size: 15px; color: #D9D5F0">Flexible, with text-to-speech, but slow to update and no image support.</p></div>
<div style="border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 20px; background: rgba(255,255,255,0.05)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 18px; color: #FFFFFF">Google Lens</p><p style="margin: 0; font-size: 15px; color: #D9D5F0">Powerful image recognition and sources, but never says whether an image is AI-generated.</p></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="background: #E74629; color: #FFFFFF; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 8px 16px">No tool covered every media type</span>
<span style="background: #9E8FE2; color: #17122E; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 8px 16px">Interfaces felt clinical</span>
<span style="background: #33AE9C; color: #0F1F1C; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 8px 16px">Nothing worked across platforms</span>
<span style="background: #F3B440; color: #1B1A2E; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 8px 16px">Little effort to teach</span>
</div>
</div>
</section>

<!-- PRINCIPLES -->
<section style="padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">Design principles</p>
<h2 style="margin: 0 0 32px; font-weight: 600; font-size: 42px; line-height: 1.15; color: #FFFFFF">What I designed against</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="background: #ADFF71; color: #18260C; border-radius: 28px; padding: 28px; transform: rotate(-1.5deg)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 44px; line-height: 1">01</p><p style="margin: 0 0 6px; font-weight: 700; font-size: 22px">Explain, don't just judge</p><p style="margin: 0; font-size: 16px">A percentage alone teaches nothing. Every verdict comes with the why and the evidence.</p></div>
<div style="background: #E08AD1; color: #2A1027; border-radius: 28px; padding: 28px; transform: rotate(1deg)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 44px; line-height: 1">02</p><p style="margin: 0 0 6px; font-weight: 700; font-size: 22px">Go where the content arrives</p><p style="margin: 0; font-size: 16px">Karen won't open a new app to check a text. Vera should already be in Messages and on her calls.</p></div>
<div style="background: #F3B440; color: #1B1A2E; border-radius: 28px; padding: 28px; transform: rotate(-0.8deg)"><p style="margin: 0 0 6px; font-weight: 700; font-size: 44px; line-height: 1">03</p><p style="margin: 0 0 6px; font-weight: 700; font-size: 22px">An AI with personality</p><p style="margin: 0; font-size: 16px">Bright, friendly and a little playful, so checking feels fun and people come back.</p></div>
</div>
</div>
</section>

<!-- SKETCHES -->
<section style="padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 320px; min-width: 0">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">Sketching</p>
<h2 style="margin: 0 0 16px; font-weight: 600; font-size: 38px; line-height: 1.15; color: #FFFFFF">From a search bar to clickable stickers</h2>
<p style="margin: 0 0 14px; color: #D9D5F0">Our first sketch was a single "detect AI" bar with a plus button that revealed media types. It was simple, but hid what Vera could do.</p>
<p style="margin: 0; color: #D9D5F0">The idea that stuck was turning each media type into a big, animated box, "like stickers, but clickable." Those boxes became the colored tiles that tie every Vera platform together.</p>
</div>
<figure style="flex: 1.4 1 460px; min-width: 0; margin: 0">
<img src="assets/419cd77cf84b5db1baf65e3672fbd91b.jpg" alt="Notebook sketches: a simple Detect AI search bar, a grid of media boxes, and sticker-like clickable shapes" style="display: block; width: 100%; height: auto; border-radius: 24px; transform: rotate(1deg); box-shadow: 0 20px 50px rgba(0,0,0,0.4)">
<figcaption style="margin-top: 14px; font-size: 14px; color: #B9B5D9">Early notebook sketches from the team.</figcaption>
</figure>
</div>
</section>

<!-- TOUR -->
<section style="padding: 64px 24px">
<div style="max-width: 1160px; margin: 0 auto">
<div style="text-align: center; margin-bottom: 44px">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">My screens · interactive walkthrough</p>
<h2 style="margin: 0 0 10px; font-weight: 700; font-size: 48px; line-height: 1.1; color: #FFFFFF">Try Vera on your phone</h2>
<p style="margin: 0 auto; max-width: 56ch; color: #D9D5F0">Pick a scenario, then use Vera the way Karen and Alex would: tap the glowing dot on each screen to take the next step.</p>
</div>
<div role="tablist" aria-label="Choose a walkthrough" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{tb.selected}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: center; justify-content: center">
<div style="flex: 0 0 auto; width: 300px; max-width: 100%">
<div style="border: 8px solid #0C0C16; border-radius: 46px; overflow: hidden; background: #151522; box-shadow: 0 30px 80px rgba(120,40,140,0.4), 0 0 0 1px rgba(255,255,255,0.08)">
<div style="position: relative; overflow: hidden">
<img src="{{src}}" alt="{{alt}}" style="{{imgStyle}}">
<sc-if value="{{showHot}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{advance}}" aria-label="{{hint}}" style="{{hotStyle}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #ADFF71; animation: vr-ping 1.4s ease-out infinite"></span></button>
</sc-if>
</div>
</div>
</div>
<div style="flex: 1 1 340px; max-width: 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="{{tagStyle}}">{{tag}}</span>
<h3 style="margin: 0; font-weight: 700; font-size: 34px; line-height: 1.1; color: #FFFFFF">{{title}}</h3>
<p style="margin: 0; font-size: 17px; color: #D9D5F0">{{blurb}}</p>
<div aria-live="polite" style="margin-top: 10px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 24px; padding: 22px 24px; min-height: 196px; box-sizing: border-box">
<p style="margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C9C4F0">Step {{stepNum}} of {{stepCount}}</p>
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; color: #FFFFFF">{{stepTitle}}</p>
<p style="margin: 0 0 14px; font-size: 16px; color: #D9D5F0">{{stepDesc}}</p>
<sc-if value="{{showHot}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: #ADFF71"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #ADFF71"></span>{{hint}}</p>
</sc-if>
<sc-if value="{{isAuto}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-weight: 600; font-size: 15px; color: #E08AD1">Hang on, Vera is working…</p>
</sc-if>
<sc-if value="{{isEnd}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" onClick="{{restart}}" style="border: 0; border-radius: 999px; background: #ADFF71; color: #18260C; font-family: inherit; font-weight: 700; font-size: 15px; padding: 12px 20px; cursor: pointer">Try it again</button>
<sc-if value="{{hasNextFlow}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{nextFlow}}" style="border: 1.5px solid rgba(255,255,255,0.5); border-radius: 999px; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 15px; padding: 12px 20px; cursor: pointer">Next: {{nextFlowLabel}}</button>
</sc-if>
</div>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="display: flex; gap: 6px; flex: 1 1 auto">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
<span style="{{d.style}}"></span>
</sc-for>
</div>
<button type="button" onClick="{{back}}" aria-label="Previous step" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" onClick="{{skip}}" aria-label="Skip to next step" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</div>
</div>
</section>

<!-- DECISIONS -->
<section style="padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
<div style="flex: 0 0 auto; width: 300px; max-width: 100%; margin: 0 auto">
<img src="assets/10631096151cb0629dcd6bf180780a28.jpg" alt="Result screen: This content is 90% AI, with a Why explanation and metadata tags" style="display: block; width: 100%; height: auto; border-radius: 34px; border: 7px solid #0C0C16; box-shadow: 0 24px 60px rgba(0,0,0,0.45)">
</div>
<div style="flex: 1 1 420px; min-width: 0">
<p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ADFF71">Key decisions</p>
<h2 style="margin: 0 0 28px; font-weight: 600; font-size: 38px; line-height: 1.15; color: #FFFFFF">Designing a verdict people can learn from</h2>
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 16px"><span aria-hidden="true" style="flex: 0 0 14px; height: 14px; margin-top: 8px; border-radius: 4px; background: #ADFF71"></span><div><p style="margin: 0 0 4px; font-weight: 700; font-size: 20px; color: #FFFFFF">Score, reason, evidence</p><p style="margin: 0; font-size: 16px; color: #D9D5F0">Results lead with a plain verdict ("This content is 90% AI"), then a Why section in everyday language, then metadata tags: codec, model, created and modified dates, and whether GPS data exists.</p></div></div>
<div style="display: flex; gap: 16px"><span aria-hidden="true" style="flex: 0 0 14px; height: 14px; margin-top: 8px; border-radius: 4px; background: #F3B440"></span><div><p style="margin: 0 0 4px; font-weight: 700; font-size: 20px; color: #FFFFFF">One color per media type, everywhere</p><p style="margin: 0; font-size: 16px; color: #D9D5F0">Video is always yellow, audio always pink, text always lime. The same six tiles appear in the app, inside Messages and on the web, so nothing has to be relearned.</p></div></div>

imgStyle: 'display:block;max-width:none;height:auto;width:' + (n * 100) + '%;transform:translateX(-' + (s.i * 100 / n).toFixed(4) + '%);transition:transform .45s cubic-bezier(.4,0,.2,1)',
hotStyle: 'position:absolute;left:' + hot[0] + '%;top:' + hot[1] + '%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid #FFFFFF;background:rgba(173,255,113,0.45);box-shadow:0 0 0 4px rgba(21,21,34,0.35);cursor:pointer;padding:0',
showHot: !!s.hot, isAuto: !!s.auto, isEnd: !!s.end, hint: s.hint || '',
stepNum: si + 1, stepCount: f.steps.length, stepTitle: s.t, stepDesc: s.d,
hasNextFlow: fi < F.length - 1, nextFlowLabel: fi < F.length - 1 ? F[fi + 1].label : '',
advance: function () { self.go(fi, si + 1); },
skip: function () { self.go(fi, si + 1); },
back: function () { self.go(fi, si - 1); },
restart: function () { self.go(fi, 0); },
nextFlow: function () { self.go(fi + 1, 0); }
});
}
}
