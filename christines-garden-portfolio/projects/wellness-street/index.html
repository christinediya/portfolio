<html lang="en">

<meta name="description" content="Wellness Street: a gamified habit tracker. A UX/UI case study by Christine Gomes.">

<body>
<template id="dc-template">
<main style="font-family: Molengo, 'Trebuchet MS', sans-serif; color: #26262E; background: #FFFBF2; font-size: 18px; line-height: 1.6; overflow-x: hidden">

<!-- HERO -->
<section style="position: relative; background-color: #F2EFFF; background-image: radial-gradient(#DE7FC2 2.5px, transparent 3px), radial-gradient(#01CC86 2.5px, transparent 3px), radial-gradient(#FFA500 2.5px, transparent 3px); background-size: 140px 140px, 180px 180px, 220px 220px; background-position: 20px 30px, 90px 110px, 160px 60px; padding: 64px 24px 40px">
<div style="max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 440px; min-width: 0">
<div style="display: flex; align-items: center; gap: 18px">
<img src="assets/711604804699de8ae2a1534b2f8670aa.png" alt="Wellness Street logo" style="width: 72px; height: 72px; border-radius: 18px; border: 2.5px solid #1D1D24; box-shadow: 4px 4px 0 #1D1D24; transform: rotate(-5deg); background: #FAF8F3">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 22px; background: #FFF1A8; color: #1D1D24; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 2px 14px; transform: rotate(-3deg); box-shadow: 3px 3px 0 #1D1D24">case study · UX/UI · 2024</span>
</div>
<h1 style="margin: 24px 0 16px; font-family: Jost, sans-serif; font-weight: 700; font-size: 80px; line-height: 0.95; color: #1D1D24; letter-spacing: -0.01em">Wellness<br><span style="background: linear-gradient(transparent 55%, #01CC86 55%, #01CC86 92%, transparent 92%); padding: 0 6px">Street</span></h1>
<p style="margin: 0 0 32px; font-size: 22px; line-height: 1.45; max-width: 32ch">A gamified habit tracker where social media is a cozy little neighborhood that cheers you on, instead of a feed you compare yourself to.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 540px">
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; color: #5A4FA0">my role</p><p style="margin: 0; font-size: 15px; line-height: 1.4">Product designer · Bulletin, Neighbors &amp; My Home</p></div>
<div style="background: #CFF5E6; border: 2.5px solid #1D1D24; border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; color: #1D5A43">team</p><p style="margin: 0; font-size: 15px; line-height: 1.4">4 designers</p></div>
<div style="background: #F9D4EC; border: 2.5px solid #1D1D24; border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; color: #8A2266">timeline</p><p style="margin: 0; font-size: 15px; line-height: 1.4">October – December 2024</p></div>
<div style="background: #CDF3FA; border: 2.5px solid #1D1D24; border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; color: #145E6E">tools</p><p style="margin: 0; font-size: 15px; line-height: 1.4">Figma, FigJam</p></div>
</div>
</div>
<div style="flex: 1 1 460px; min-width: 0; position: relative; display: flex; justify-content: center; align-items: center; min-height: 460px">
<div aria-hidden="true" style="position: absolute; width: 78%; aspect-ratio: 1; border-radius: 46% 54% 52% 48% / 55% 45% 55% 45%; background: #01CC86; border: 3px solid #1D1D24"></div>
<img src="assets/946326e6c25c87a2251601f6f23d64fa.png" alt="Wellness Street shop and add-goal screens on two phones" style="position: relative; width: 100%; max-width: 560px; height: auto; display: block">
<img src="assets/785c3dba5aad105e9fa4eb3e2c96d351.png" alt="" aria-hidden="true" style="position: absolute; left: 4%; top: 6%; width: 52px; height: auto; --r: -14deg; animation: ws-bob 3.2s ease-in-out infinite">
<img src="assets/dce230364c7ae3f548a7bfa63ab70037.png" alt="" aria-hidden="true" style="position: absolute; right: 8%; top: 4%; width: 54px; height: auto; --r: 10deg; animation: ws-bob 2.6s ease-in-out infinite 0.4s">
<img src="assets/764b15dc26514e88362160c4a8fc87db.png" alt="" aria-hidden="true" style="position: absolute; right: 2%; bottom: 8%; width: 62px; height: auto; --r: 8deg; animation: ws-bob 3.6s ease-in-out infinite 0.8s">
<img src="assets/d4d11ad37c1acdb6dc20cbd7cbec5f06.png" alt="" aria-hidden="true" style="position: absolute; left: 2%; bottom: 6%; width: 58px; height: auto; --r: -6deg; animation: ws-bob 3s ease-in-out infinite 1.1s">
</div>
</div>
</section>
<svg viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 44px; background: #FFFBF2"><path d="M0 0 H1440 V22 Q1380 52 1320 22 T1200 22 T1080 22 T960 22 T840 22 T720 22 T600 22 T480 22 T360 22 T240 22 T120 22 T0 22 Z" fill="#F2EFFF"></path></svg>

<!-- OVERVIEW -->
<section style="padding: 64px 24px 40px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
<div style="flex: 1 1 340px; min-width: 0; position: relative">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; background: #01CC86; color: #10241B; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 0 12px; transform: rotate(-2deg); box-shadow: 3px 3px 0 #1D1D24">the big question</span>
<h2 style="margin: 18px 0 0; font-family: Jost, sans-serif; font-weight: 600; font-size: 34px; line-height: 1.22">How might we use the good parts of social media to build community and support wellness in a fast-paced world?</h2>
</div>
<div style="flex: 1.3 1 420px; min-width: 0">
<p style="margin: 0 0 20px"><strong style="font-family: Jost, sans-serif; font-weight: 600">The problem.</strong> Constant social media use and internet multitasking are linked with poorer mental health and procrastination. Most feeds reward comparison, and most habit trackers feel like a chore you're failing at.</p>
<p style="margin: 0 0 24px"><strong style="font-family: Jost, sans-serif; font-weight: 600">Our answer.</strong> Wellness Street is a neighborhood. Your avatar moves in, sets goals, and lives alongside neighbors who share progress, swap gifts, and keep each other going.</p>
<div style="position: relative; background: #FFF1A8; border: 2.5px solid #1D1D24; border-radius: 22px; padding: 22px 24px 22px 96px; box-shadow: 5px 5px 0 #1D1D24">
<img src="assets/5d56cef95062601f9a02e339057ea92b.png" alt="" aria-hidden="true" style="position: absolute; left: 18px; top: 20px; width: 60px; height: auto; transform: rotate(-6deg)">
<p style="margin: 0"><strong style="font-family: Jost, sans-serif; font-weight: 600">My part.</strong> I owned the two systems that make Wellness Street feel like a place instead of a checklist: the <strong>Bulletin</strong> (plus Neighbors and gifting), where people share progress, and <strong>My Home</strong>, the reward loop where healthy habits become coins, coins become furniture, and furniture becomes gifts.</p>
</div>
</div>
</div>
</section>

<!-- APP TOUR -->
<section style="padding: 56px 24px 72px">
<div style="max-width: 1160px; margin: 0 auto">
<div style="text-align: center; margin-bottom: 44px">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; background: #F9D4EC; color: #1D1D24; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 0 12px; transform: rotate(2deg); box-shadow: 3px 3px 0 #1D1D24">take a walk down the street</span>
<h2 style="margin: 16px 0 10px; font-family: Jost, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1">A tour of the app</h2>
<p style="margin: 0 auto; max-width: 56ch">Each phone plays through its flow on its own. Use the arrows to step through at your own pace.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 32px">
<sc-for list="{{flows}}" as="f" hint-placeholder-count="5">
<article style="{{f.cardStyle}}">
<div style="flex: 0 0 auto; width: 212px; max-width: 100%">
<div style="border: 5px solid #1D1D24; border-radius: 30px; overflow: hidden; background: #FFFFFF; box-shadow: 6px 6px 0 #1D1D24">
<img src="{{f.src}}" alt="{{f.alt}}" style="{{f.imgStyle}}">
</div>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{f.mine}}" hint-placeholder-val="{{true}}">
<span style="align-self: flex-start; font-family: Gaegu, cursive; font-weight: 700; font-size: 18px; background: #01CC86; color: #10241B; border: 2px solid #1D1D24; border-radius: 10px; padding: 0 10px; transform: rotate(-2deg)">my feature</span>
</sc-if>
<sc-if value="{{f.team}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; font-family: Gaegu, cursive; font-weight: 700; font-size: 18px; background: #FFFFFF; color: #1D1D24; border: 2px solid #1D1D24; border-radius: 10px; padding: 0 10px; transform: rotate(-2deg)">team feature</span>
</sc-if>
<h3 style="margin: 0; font-family: Jost, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.15">{{f.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">{{f.blurb}}</p>
<p aria-live="polite" style="margin: 6px 0 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; line-height: 1.2; color: #1D1D24; min-height: 52px">{{f.stepNum}}. {{f.stepLabel}}</p>
<div aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 5px">
<sc-for list="{{f.dots}}" as="d" hint-placeholder-count="6">
<span style="{{d.style}}"></span>
</sc-for>
</div>
<div style="display: flex; gap: 10px; margin-top: 6px">
<button type="button" onClick="{{f.prev}}" aria-label="Previous screen" style="width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid #1D1D24; background: #FFFFFF; box-shadow: 3px 3px 0 #1D1D24; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" onClick="{{f.next}}" aria-label="Next screen" style="width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid #1D1D24; background: #01CC86; box-shadow: 3px 3px 0 #1D1D24; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</article>
</sc-for>
</div>
</div>
</section>

<svg viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 44px; background: #FFFBF2"><path d="M0 60 V30 Q60 0 120 30 T240 30 T360 30 T480 30 T600 30 T720 30 T840 30 T960 30 T1080 30 T1200 30 T1320 30 T1440 30 V60 Z" fill="#E3F9EF"></path></svg>
<!-- RESEARCH -->
<section style="background: #E3F9EF; padding: 48px 24px 72px">
<div style="max-width: 1120px; margin: 0 auto">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; background: #FFFFFF; color: #1D1D24; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 0 12px; transform: rotate(-2deg); box-shadow: 3px 3px 0 #1D1D24">what research told us</span>
<h2 style="margin: 16px 0 12px; font-family: Jost, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15">Self-care tools take themselves way too seriously</h2>
<p style="margin: 0 0 36px; max-width: 64ch">As a team we interviewed Gen Z and younger millennials about work-life balance, self-care and their phone habits, then compared habit and self-care apps such as Habit Tracker and Finch. Three themes shaped everything I designed afterward.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 26px">
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 24px; padding: 26px; box-shadow: 5px 5px 0 #1D1D24; transform: rotate(-1deg)">
<img src="assets/42fee551ac63cf643b102abc9aa17dae.png" alt="" aria-hidden="true" style="width: 54px; height: auto; display: block; margin-bottom: 10px">
<p style="margin: 0 0 6px; font-family: Jost, sans-serif; font-weight: 700; font-size: 21px">What people wanted</p>
<p style="margin: 0; font-size: 16px">Something organized, customizable and fun: low-stress play that doesn't feed screen addiction.</p>
</div>
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 24px; padding: 26px; box-shadow: 5px 5px 0 #1D1D24; transform: rotate(0.8deg)">
<img src="assets/54fb61359c07bbe8f28f6f874e90e7cd.png" alt="" aria-hidden="true" style="width: 50px; height: auto; display: block; margin-bottom: 10px">
<p style="margin: 0 0 6px; font-family: Jost, sans-serif; font-weight: 700; font-size: 21px">What pushed them away</p>
<p style="margin: 0; font-size: 16px">Comparison with others, low morale after a missed goal, and apps that nag too insistently.</p>
</div>
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 24px; padding: 26px; box-shadow: 5px 5px 0 #1D1D24; transform: rotate(-0.6deg)">
<img src="assets/9662f70808038aca5c0aba431fe77c75.png" alt="" aria-hidden="true" style="width: 50px; height: auto; display: block; margin-bottom: 10px">
<p style="margin: 0 0 6px; font-family: Jost, sans-serif; font-weight: 700; font-size: 21px">What they struggled with</p>
<p style="margin: 0; font-size: 16px">Accountability. It's easy to fixate on what you did wrong; people wanted help focusing on what they could do next.</p>
</div>
</div>
</div>
</section>
<svg viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 44px; background: #FFFBF2"><path d="M0 0 H1440 V22 Q1380 52 1320 22 T1200 22 T1080 22 T960 22 T840 22 T720 22 T600 22 T480 22 T360 22 T240 22 T120 22 T0 22 Z" fill="#E3F9EF"></path></svg>

<!-- PRINCIPLES -->
<section style="padding: 64px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; background: #FFF1A8; color: #1D1D24; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 0 12px; transform: rotate(2deg); box-shadow: 3px 3px 0 #1D1D24">house rules</span>
<h2 style="margin: 16px 0 36px; font-family: Jost, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15">Three principles for my features</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<img src="assets/5d56cef95062601f9a02e339057ea92b.png" alt="" aria-hidden="true" style="width: 64px; height: auto; flex: 0 0 auto; margin-top: 18px">
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 22px 22px 22px 4px; padding: 18px 20px; box-shadow: 4px 4px 0 #1D1D24">
<p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 20px">Progress over performance</p>
<p style="margin: 0; font-size: 16px">Nothing on the feed should be rankable. Share the step, not the scoreboard.</p>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start">
<img src="assets/ba0dc3452ec868441d9eae79707ae4ff.png" alt="" aria-hidden="true" style="width: 64px; height: auto; flex: 0 0 auto; margin-top: 18px">
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 22px 22px 22px 4px; padding: 18px 20px; box-shadow: 4px 4px 0 #1D1D24">
<p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 20px">Rewards are earned by wellness</p>
<p style="margin: 0; font-size: 16px">Coins come from healthy actions and kindness, never from a paywall.</p>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start">
<img src="assets/5ba64a7658d99d54e2af053706ee584e.png" alt="" aria-hidden="true" style="width: 64px; height: auto; flex: 0 0 auto; margin-top: 18px">
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 22px 22px 22px 4px; padding: 18px 20px; box-shadow: 4px 4px 0 #1D1D24">
<p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 20px">Generosity is the currency</p>
<p style="margin: 0; font-size: 16px">Encouragement should be concrete: a gift on a neighbor's doorstep beats a like.</p>
</div>
</div>
</div>
</div>
</section>

<!-- SKETCHES -->
<section style="padding: 32px 24px 64px">
<div style="max-width: 1120px; margin: 0 auto">
<span style="display: inline-block; font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; background: #CDF3FA; color: #1D1D24; border: 2.5px solid #1D1D24; border-radius: 12px; padding: 0 12px; transform: rotate(-2deg); box-shadow: 3px 3px 0 #1D1D24">pencils out</span>
<h2 style="margin: 16px 0 12px; font-family: Jost, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15">Concept sketches</h2>
<p style="margin: 0 0 28px; max-width: 64ch">Before mid-fidelity, I sketched the core screens of my features to test those rules: where a post lives, who sees it, how a neighbor gets encouraged, and how coins move from a finished goal to a decorated home.</p>
<div style="overflow-x: auto; border-radius: 26px; border: 2.5px solid #1D1D24; box-shadow: 6px 6px 0 #1D1D24">
<div style="width: 1440px; height: 1000px; box-sizing: border-box; padding: 52px 70px; background-color: #FBF8F0; background-image: radial-gradient(#E2DAC4 1px, transparent 1.4px); background-size: 24px 24px; font-family: Gaegu, 'Comic Sans MS', cursive; color: #34343C; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: baseline; gap: 24px">
<h2 style="margin: 0; font-size: 46px; font-weight: 700; line-height: 1">Wellness Street: concept sketches</h2>
<p style="margin: 0; font-size: 24px; color: #5A4FA0">my features · Bulletin + My Home</p>
</div>

<div style="display: flex; gap: 50px">

<!-- 1 BULLETIN -->
<div style="width: 220px; display: flex; flex-direction: column; gap: 10px">

<p style="position: absolute; right: 0; bottom: -36px; margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 20px; color: #5A4FA0; transform: rotate(-4deg)">gift · comment · heart, and no counts!</p>

<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 20px; padding: 16px 20px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 19px">Every post is tied to a goal</p><p style="margin: 0; font-size: 16px">When you share, you pick which of your goals it's about. It's a required field, which keeps the feed about wellness rather than highlight reels.</p></div>
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 20px; padding: 16px 20px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 19px">You choose the audience, every time</p><p style="margin: 0; font-size: 16px">Posts go to Neighbors, Close friends only, or My eyes only. The private journal gives bad days a place to land without performing for anyone.</p></div>
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 20px; padding: 16px 20px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 19px">Reactions without a scoreboard</p><p style="margin: 0; font-size: 16px">Each post offers three actions: send a gift, comment, or heart. No public tallies, so there's nothing to rank yourself against.</p></div>
<div style="background: #FFFFFF; border: 2.5px solid #1D1D24; border-radius: 20px; padding: 16px 20px; box-shadow: 4px 4px 0 #1D1D24"><p style="margin: 0 0 4px; font-family: Jost, sans-serif; font-weight: 700; font-size: 19px">Asking for help is a post type</p><p style="margin: 0; font-size: 16px">Community polls let a neighbor ask, say, which water bottle will help them drink more. Accountability becomes a conversation.</p></div>

<p style="margin: 0"><strong style="font-family: Jost, sans-serif; font-weight: 700">Removing things is a design decision.</strong> The hardest calls on the Bulletin were about what to leave out. Dropping public like counts and making audience a choice on every post each took away a place for comparison to creep in.</p>
